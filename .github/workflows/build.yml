name: Compilação .NET 10

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore SearchNarutoAPI.csproj

      - name: Compilar aplicação
        run: dotnet build SearchNarutoAPI.csproj --configuration Release --no-restore
